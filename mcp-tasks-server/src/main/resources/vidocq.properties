# Chappe HTTP listener. Loopback only: the REST API writes to the database without authentication.
# 18090, not 8080: this module keeps every port it opens in 18090-18099 (README.md, "Ports").
vidocq.chappe.listener.default.host=127.0.0.1
vidocq.chappe.listener.default.port=18090

# Dev console: on in a dev launch only (vidocq:dev, an IDE, or run.sh with -Dvidocq.launch.mode=dev), always on the
# loopback address. 18092, not the console's default 8888. A taken port does not stop the application: the console
# then listens on a free port and logs the URL it bound ("Vidocq dev console: http://127.0.0.1:<port>/").
vidocq.devconsole.port=18092

# Mansart pool: the @Default DataSource, an H2 database FILE under target/ (relative to the module directory,
# where both run.sh and vidocq:dev start the JVM). It survives vidocq:dev reloads and restarts; mvn clean wipes it.
# DB_CLOSE_ON_EXIT=FALSE leaves closing the database to the pool's shutdown rather than H2's own shutdown hook.
# No AUTO_SERVER and no H2 console or TCP server: each of them would open a port.
vidocq.pool.url=jdbc:h2:file:./target/h2/tasks;DB_CLOSE_ON_EXIT=FALSE
vidocq.pool.username=tasks
# H2 stores these credentials in the database when it creates it: after changing them, delete target/h2.
# The value is never logged or shown; the dev console reports it as "configured" only.
vidocq.pool.password=tasks-a200f0b52c6d4820
vidocq.pool.minIdle=1
vidocq.pool.maxSize=8
vidocq.pool.acquireTimeout=PT5S
vidocq.pool.leakDetectionThreshold=PT30S

# Flyway scripts. Flyway uses its default, classpath:db/migration, under vidocq:dev and run.sh: Vidocq/vidocq#96
# fixed the layering that used to hide the application module's resources from the migration extension's class
# loader, so the scripts are found on the class path in every launch and vidocq.migration.locations is not set.
