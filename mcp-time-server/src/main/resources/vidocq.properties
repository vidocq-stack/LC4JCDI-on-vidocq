# The MCP Inspector, and any client on another host or in a container, has to reach this server, so the
# listener binds every interface. The port is a high one: 8080 is the first port anything else on a
# development machine takes, and two servers on it fail in ways that look like the example is broken.
vidocq.chappe.listener.default.host=0.0.0.0
vidocq.chappe.listener.default.port=18080
